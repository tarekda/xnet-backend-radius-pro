groups:
  - name: backend_basic
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Backend is down
          description: Prometheus cannot scrape the backend /metrics endpoint.

      - alert: BackendHigh5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5..", job="backend"}[5m]))
          /
          sum(rate(http_requests_total{job="backend"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: High 5xx rate
          description: More than 5% of requests are 5xx over the last 5 minutes.

      - alert: BackendHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="backend"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: High p95 latency
          description: p95 request latency is > 1s for 10 minutes.

  - name: freeradius_noc
    rules:
      - alert: FreeRadiusDown
        expr: freeradius_up == 0 or up{job="freeradius"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: FreeRADIUS is down
          description: Status-Server probe or Prometheus scrape for FreeRADIUS failed.

      - alert: FreeRadiusHighRejectRate
        expr: |
          (
            rate(freeradius_access_rejects_total[5m])
            /
            clamp_min(rate(freeradius_access_requests_total[5m]), 0.001)
          ) > 0.35
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: High RADIUS reject rate
          description: More than 35% of Access-Requests are rejects over 5m.

